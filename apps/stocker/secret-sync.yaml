# Template for the stocker-sync secret. Fill in the empty values locally,
# apply it, then revert the file. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: stocker-sync-env
  namespace: stocker
type: Opaque
stringData:
  # Homelab Postgres (source): read-only role stocker_sync.
  SOURCE_PGHOST: "postgres.postgres.svc.cluster.local"
  SOURCE_PGPORT: "5432"
  SOURCE_PGDATABASE: "stocker"
  SOURCE_PGUSER: "stocker_sync"
  SOURCE_PGPASSWORD: ""
  # Supabase (target): session pooler, port 5432.
  TARGET_PGHOST: ""
  TARGET_PGPORT: "5432"
  TARGET_PGDATABASE: "postgres"
  TARGET_PGUSER: "stocker_writer.<project-ref>"
  TARGET_PGPASSWORD: ""
