apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-msft
  namespace: stocker
spec:
  schedule: "15 10-16 * * 1-5"
  timeZone: "America/New_York"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: msft-cron
              image: mikebarkas/homelab-stocker:1.0.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: stocker-env
              env:
                - name: STOCK_SYMBOL
                  value: "MSFT"
          restartPolicy: OnFailure
